# fly.toml app configuration file generated for bdt-library-api on 2026-01-28T22:49:30-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bdt-library-api'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile.railway'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/q/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
