# fly.toml app configuration file generated for bdt-audit-tool on 2026-01-28T23:04:15-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bdt-audit-tool'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_URL = 'http://bdt-library-api.internal:8080'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
